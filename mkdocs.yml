markdown_extensions:
  # 脚注：正文写 [^1]，文末写 [^1]: 解释，渲染成带上标编号的尾注
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details

